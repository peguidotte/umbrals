name: Actor authoring contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: actor-authoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actor-authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.16'
      - name: Install existing asset dependencies
        run: python -m pip install -r tools/requirements-assets.txt
      - name: Check authored requirements and published compatibility
        run: python -m unittest tools.actor_authoring.test_validate -v
