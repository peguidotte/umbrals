name: Recover harness failure diagnostics
on:
  push:
    paths:
      - .github/workflows/recover-diagnostics.yml
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Evidence artifact ID; leave empty to inspect the latest failed validation
        required: false
        type: string
      task:
        description: Harness task name
        required: true
        default: web-fixtures
        type: string
permissions:
  actions: read
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Recover selected task logs from evidence archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          TASK_NAME: ${{ inputs.task || 'web-fixtures' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$ARTIFACT_ID" ]]; then
            FAILED_RUN="$(gh api "repos/$REPO/actions/runs?status=failure&branch=main&event=push&per_page=30" --jq '.workflow_runs[] | select(.path == ".github/workflows/umbral.yml") | .id' | head -n 1)"
            if [[ ! "$FAILED_RUN" =~ ^[0-9]+$ ]]; then echo "No failed validation run found"; exit 1; fi
            ARTIFACT_ID="$(gh api "repos/$REPO/actions/runs/$FAILED_RUN/artifacts" --jq '.artifacts[] | select(.name == "umbral-diagnostics" or .name == "umbral-evidence") | .id' | head -n 1)"
            export ARTIFACT_ID
            echo "Inspecting failed run $FAILED_RUN, artifact $ARTIFACT_ID"
          fi
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$TASK_NAME" =~ ^[a-zA-Z0-9._-]+$ ]]
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/evidence.zip"
          python - <<'PY'
          import json, os, re, zipfile
          from pathlib import Path
          archive = Path(os.environ['RUNNER_TEMP']) / 'evidence.zip'
          suffix = '/tasks/' + os.environ['TASK_NAME'] + '/process.log'
          with zipfile.ZipFile(archive) as data:
              compact = [item for item in data.infolist() if item.filename.split('/')[-1] == 'ci-diagnostics.json']
              if compact:
                  item = compact[0]
                  if item.file_size > 1_000_000:
                      raise SystemExit('Compact diagnostics exceeds 1 MB')
                  report = json.loads(data.read(item))
                  task = report.get('tasks', {}).get(os.environ['TASK_NAME'])
                  if task is None:
                      raise SystemExit('Selected task is absent from compact diagnostics')
                  print(json.dumps(task, indent=2))
                  raise SystemExit(0)
              matches = [item for item in data.infolist() if ('/' + item.filename).endswith(suffix)]
              if not matches:
                  raise SystemExit('No matching task process.log in artifact')
              for item in matches:
                  if item.file_size > 10_000_000:
                      raise SystemExit('Log exceeds 10 MB safety limit: ' + item.filename)
                  lines = data.read(item).decode('utf-8', errors='replace').splitlines()
                  errors = [line for line in lines if re.search(r'error|exception|traceback|failed|no space', line, re.I)]
                  print('\n### ' + item.filename + '\n' + '\n'.join(errors[-40:]) + '\n--- tail ---\n' + '\n'.join(lines[-40:]))
          PY
