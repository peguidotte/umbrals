name: Umbral — validate and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: umbral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Full headless checks and Web exports
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.16'
      - name: Validate immutable assets
        env:
          ASSET_PR_BASE: ${{ github.event.pull_request.base.sha }}
          ASSET_PUSH_BASE: ${{ github.event.before }}
        run: |
          python -m pip install -r tools/requirements-browser.txt
          asset_base="${ASSET_PR_BASE:-${ASSET_PUSH_BASE:-origin/main}}"
          if [[ "$asset_base" =~ ^0+$ ]]; then asset_base=origin/main; fi
          python tools/assets.py validate --base-ref "$asset_base"
      - name: Prepare tool paths
        run: printf 'FERAL_STATE_ROOT=%s/umbral-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/umbral-tools/.local/bin/godot
            ${{ runner.temp }}/umbral-tools/.local/share/godot/export_templates
          key: godot-4.6.3-${{ runner.os }}-${{ runner.arch }}-release-v2
      - name: Install verified engine
        run: source tools/environment.sh && python tools/install_godot.py
      - name: Execute complete headless and export graph
        run: python tools/ci_parallel.py prepare --output artifacts/ci-prepare
      - name: Prepare headless diagnostics
        if: always()
        run: python tools/ci_diagnostics.py --report artifacts/ci-prepare/harness-run.json --output test-results/ci-prepare-diagnostics.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: umbral-prepare-diagnostics
          path: test-results/ci-prepare-diagnostics.json
          retention-days: 14
      - name: Pack preparation for browser workers
        run: tar -cf "$RUNNER_TEMP/prepare.tar" -C artifacts ci-prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: umbral-preparation
          path: ${{ runner.temp }}/prepare.tar
          compression-level: 0
          retention-days: 14

  browser:
    name: Browser ${{ matrix.group }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [integration, layout, expedition, other]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.16'
      - name: Prepare tool paths
        run: printf 'FERAL_STATE_ROOT=%s/umbral-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/umbral-tools/.local/bin/godot
            ${{ runner.temp }}/umbral-tools/.local/share/godot/export_templates
          key: godot-4.6.3-${{ runner.os }}-${{ runner.arch }}-release-v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/umbral-tools/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/requirements-browser.txt') }}
      - name: Install verified tools
        run: |
          source tools/environment.sh
          python tools/install_godot.py
          python -m pip install -r tools/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: umbral-preparation
          path: ${{ runner.temp }}/preparation
      - name: Import project for browser-side plan generation
        run: |
          source tools/environment.sh
          mkdir -p test-results
          godot --headless --editor --import --quit >test-results/browser-import.log 2>&1
          if grep -En 'SCRIPT ERROR:|^ERROR:|instances leaked|Resources still in use' test-results/browser-import.log; then
            cat test-results/browser-import.log
            exit 1
          else
            scan_status=$?
            if [ "$scan_status" -ne 1 ]; then exit "$scan_status"; fi
          fi
      - name: Verify preparation and run scenarios
        run: |
          mkdir -p artifacts
          tar -xf "$RUNNER_TEMP/preparation/prepare.tar" -C artifacts
          python tools/ci_parallel.py shard --prepared artifacts/ci-prepare --group '${{ matrix.group }}' --output 'artifacts/ci-${{ matrix.group }}'
      - name: Prepare browser diagnostics
        if: always()
        run: python tools/ci_diagnostics.py --report 'artifacts/ci-${{ matrix.group }}/shard.json' --output 'test-results/ci-${{ matrix.group }}-diagnostics.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: umbral-browser-${{ matrix.group }}-diagnostics
          path: |
            test-results/ci-${{ matrix.group }}-diagnostics.json
            test-results/browser-import.log
          retention-days: 14
      - name: Pack browser evidence
        if: always()
        run: tar -cf "$RUNNER_TEMP/shard.tar" -C artifacts 'ci-${{ matrix.group }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: umbral-browser-${{ matrix.group }}
          path: ${{ runner.temp }}/shard.tar
          compression-level: 0
          retention-days: 14

  builds:
    name: Desktop builds and native smoke
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.16'
      - run: printf 'FERAL_STATE_ROOT=%s/umbral-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/umbral-tools/.local/bin/godot
            ${{ runner.temp }}/umbral-tools/.local/share/godot/export_templates
          key: godot-4.6.3-${{ runner.os }}-${{ runner.arch }}-release-v2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: umbral-preparation
          path: ${{ runner.temp }}/preparation
      - name: Install tools, build and smoke-test
        run: |
          source tools/environment.sh
          python tools/install_godot.py
          python -m pip install -r tools/requirements-browser.txt
          mkdir -p artifacts
          tar -xf "$RUNNER_TEMP/preparation/prepare.tar" -C artifacts
          PYTHONPATH=tools python -c "from ci_parallel import preparation; from harness_lib.builds import publish_build; from pathlib import Path; p=preparation(Path('artifacts/ci-prepare').resolve()); publish_build(p['tasks']['web']['build_directory'], 'Web')"
          bash tools/build.sh Windows
          bash tools/build.sh Linux
          python tools/package.py
          mkdir -p test-results
          builds/linux/Umbral.x86_64 --headless -- --smoke-exit >test-results/native-linux.log 2>&1
          if grep -En 'SCRIPT ERROR:|^ERROR:|instances leaked|Resources still in use' test-results/native-linux.log; then
            exit 1
          else
            scan_status=$?
            if [ "$scan_status" -ne 1 ]; then exit "$scan_status"; fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: umbral-builds
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            builds/*.zip
            builds/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: umbral-native-log
          path: test-results/native-linux.log
          retention-days: 14

  validate:
    name: Aggregate full acceptance
    if: always()
    needs: [prepare, browser, builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.16'
      - run: python -m pip install -r tools/requirements-browser.txt
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: umbral-*
          path: ${{ runner.temp }}/downloads
      - name: Verify all reports and assemble review
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BUILDS_RESULT: ${{ needs.builds.result }}
        run: |
          test "$PREPARE_RESULT" = success && test "$BROWSER_RESULT" = success && test "$BUILDS_RESULT" = success
          mkdir -p artifacts
          tar -xf "$RUNNER_TEMP/downloads/umbral-preparation/prepare.tar" -C artifacts
          for group in integration layout expedition other; do
            tar -xf "$RUNNER_TEMP/downloads/umbral-browser-$group/shard.tar" -C artifacts
          done
          mkdir -p builds
          cp "$RUNNER_TEMP/downloads/umbral-builds/manifest.json" builds/manifest.json
          python tools/ci_parallel.py aggregate --prepared artifacts/ci-prepare --shard artifacts/ci-integration --shard artifacts/ci-layout --shard artifacts/ci-expedition --shard artifacts/ci-other --output artifacts/ci-review
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: umbral-evidence
          retention-days: 14
          path: |
            test-results/ci-run.json
            artifacts/ci-review/
      - name: Prepare compact diagnostics
        if: always()
        run: python tools/ci_diagnostics.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: umbral-diagnostics
          retention-days: 14
          path: test-results/ci-diagnostics.json
      - name: Publish validation summary
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: python tools/ci_report.py --report test-results/ci-run.json --status "$CI_JOB_STATUS"
