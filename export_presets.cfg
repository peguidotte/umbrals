[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/battle/atlas.json,assets/battle/evolved-atlas.json"
exclude_filter="tests/*,tools/*,docs/*,builds/*,test-results/*,artifacts/*,.agents/*,skills-lock.json"
export_path="builds/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"description\" content=\"Umbral: Ecos do Bosque — poderes, traits, passivas e evoluções.\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/battle/atlas.json,assets/battle/evolved-atlas.json"
exclude_filter="tests/*,tools/*,docs/*,builds/*,test-results/*,artifacts/*,.agents/*,skills-lock.json"
export_path="builds/windows/Umbral.exe"

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
application/modify_resources=false
codesign/enable=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.2]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="assets/battle/atlas.json,assets/battle/evolved-atlas.json"
exclude_filter="tests/*,tools/*,docs/*,builds/*,test-results/*,artifacts/*,.agents/*,skills-lock.json"
export_path="builds/linux/Umbral.x86_64"

[preset.2.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
